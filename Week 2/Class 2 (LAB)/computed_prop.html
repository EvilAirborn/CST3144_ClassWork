<html lang="en">

    <head>
        <title>Vue.js Pet Depost</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    </head>

    <body>
        <div id="app">
            <p> Area is equal to: {{ area }} </p>
            <button @click="length +=1">Add length</button>
            <button @click="width +=1">Add width</button>
        </div>


        <script type="text/javascript">
            let webstore = new Vue({
                el: '#app',
                data: {
                    sitename: 'Vue.js Pet Depot',
                    length: 10,
                    width: 5,
                },
                computed:{
                    area: function() {
                        return this.width * this.length;
                    },
                },
            });
        </script>
    </body>
    
</html>
